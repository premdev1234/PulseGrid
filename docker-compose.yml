version: '3.9'
services:
  redis:
    image: redis:7
    container_name: Puslegrid-redis

    ports:
      - "6379:6379"

  postgres:
    image: postgres:15

    container_name: Pulsegrid-postgres

    environment:
      POSTGRES_USER: Prem
      POSTGRES_PASSWORD: Prem
      POSTGRES_DB: pulsegrid

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data # creates a persistent storage

volumes:
  postgres_data: